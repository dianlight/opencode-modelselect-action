<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Select</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: CanvasText;
    background: transparent;
    padding: 8px 10px;
  }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row + .row { margin-top: 6px; }
  .label { opacity: 0.65; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .pill {
    display: inline-block;
    padding: 0 7px;
    border-radius: 999px;
    border: 1px solid ButtonBorder;
    background: ButtonFace;
    color: ButtonText;
    white-space: nowrap;
  }
  .pill.dim { opacity: 0.6; }
  .pill.warn { border-color: #b7791f; }
  .pill.err { border-color: #b3261e; }
  .pill.ok { border-color: #1e7e34; }
  .seg { display: inline-flex; border: 1px solid ButtonBorder; border-radius: 6px; overflow: hidden; }
  .seg button {
    appearance: none;
    border: 0;
    background: ButtonFace;
    color: ButtonText;
    font: inherit;
    padding: 2px 10px;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid ButtonBorder; }
  .seg button[aria-pressed="true"] { background: Highlight; color: HighlightText; }
  .seg button:disabled { opacity: 0.5; cursor: default; }
  .note { opacity: 0.75; }
  .error { color: #b3261e; }
  @media (prefers-color-scheme: dark) { .error { color: #f2b8b5; } }
  .stale { opacity: 0.55; }
</style>
</head>
<body>
<div id="root"><span class="note">Loading model status…</span></div>
<script src="./main.js"></script>
</body>
</html>
