<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model select</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 12px/1.45 var(--font-sans, var(--oc-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif));
    color: var(--surface-foreground, var(--oc-fg, CanvasText));
    background: transparent;
    padding: 8px 10px;
  }
  .ms { display: flex; flex-direction: column; gap: 6px; }
  .ms-ico {
    margin-left: 6px;
    font-size: 0.875rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
  }
  .ms-ico.go-ok { color: var(--success-text, var(--oc-success-text, #1e7e34)); }
  .ms-ico.go-out { color: var(--error-text, var(--oc-error-text, #b3261e)); }
  .ms-ico.go-unknown { color: var(--surface-muted-foreground, var(--oc-muted, GrayText)); }
  .ms-ico.suggest { color: var(--warning-text, var(--oc-warning-text, #b7791f)); }
  .ms-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ms-title { font-weight: 600; font-size: 12px; white-space: nowrap; }
  .ms-tabs { min-width: 0; }
  .ms-hint {
    font-size: 11px;
    color: var(--surface-muted-foreground, var(--oc-muted, GrayText));
  }
  .ms-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 2px 0;
  }
  .ms-field {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    min-width: 0;
  }
  .ms-k {
    flex: 0 0 auto;
    font-size: 0.875rem;
    color: var(--surface-muted-foreground, var(--oc-muted, GrayText));
  }
  .ms-v {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.875rem;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ms-v.mono { font-family: var(--font-mono, var(--oc-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace)); }
  .ms-grid.stale .ms-grid, .ms-grid.stale { opacity: 0.55; }
  .ms-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .ms-badges:empty { display: none; }
  .ms-note {
    font-size: 12px;
    color: var(--surface-muted-foreground, var(--oc-muted, GrayText));
  }
  .ms-error { color: var(--error-text, var(--oc-error-text, #b3261e)); font-size: 12px; }
  @media (prefers-color-scheme: dark) { .ms-error { color: var(--error-text, var(--oc-error-text, #f2b8b5)); } }
  .ms-fallback-badge {
    display: inline-block;
    padding: 0 7px;
    border-radius: 999px;
    border: 1px solid ButtonBorder;
    background: ButtonFace;
    color: ButtonText;
    white-space: nowrap;
    font-size: 11px;
  }
  .ms-fallback-tab {
    appearance: none;
    border: 1px solid ButtonBorder;
    background: ButtonFace;
    color: ButtonText;
    font: inherit;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .ms-fallback-tab.on { background: Highlight; color: HighlightText; }
</style>
</head>
<body>
<div id="root"><span class="ms-note">Loading model status…</span></div>
<script src="./main.js"></script>
</body>
</html>
