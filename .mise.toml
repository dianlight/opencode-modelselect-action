[tools]
"conda:basedpyright" = "latest"
python = "3.14"
ruff = "latest"
yamllint = "1.38"


[hooks]
postinstall = ["pip install -r requirements.txt"]

[tasks.maintenance]
run = "python scripts/opencode_maintenance.py"
description = "Run the OpenCode maintenance script"

[tasks.lint-yaml]
run = "yamllint .github .github/workflows config"
description = "Lint all YAML files"

[tasks.lint-python]
run = "ruff check scripts/ tests/"
description = "Lint all Python files with ruff"

[tasks.test-python]
run = "python -m unittest discover -s tests"
description = "Run Python unit tests for the maintenance script"

[tasks.lint-types]
run = "basedpyright --level error scripts/"
description = "Type-check all Python files with basedpyright"

[tasks.build-core]
run = "node scripts/build-core.js"
description = "Vendor core/*.js into github-action and plugin (committed copies)"

[tasks.build-core-check]
run = "node scripts/build-core.js --check"
description = "Fail when vendored core copies drift from core/"
