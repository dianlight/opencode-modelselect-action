[tools]
"conda:basedpyright" = "latest"
python = "3.14"
ruff = "latest"
yamllint = "1.38"


[hooks]
postinstall = ["pip install -r requirements.txt"]

[tasks.maintenance]
run = "python scripts/opencode_maintenance.py"
description = "Run the OpenCode maintenance script"

[tasks.lint-yaml]
run = "yamllint .github .github/workflows config"
description = "Lint all YAML files"

[tasks.lint-python]
run = "ruff check scripts/"
description = "Lint all Python files with ruff"

[tasks.lint-types]
run = "basedpyright --level error scripts/"
description = "Type-check all Python files with basedpyright"
