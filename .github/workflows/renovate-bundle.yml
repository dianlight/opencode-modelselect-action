name: Rebuild bundles for Renovate PRs

# The extension bundles (panel/main.js, service/main.js, background/main.js) are
# committed build artifacts that inline @openchamber/sdk. A dependency bump
# therefore leaves the committed bundles stale, and the CI staleness check in
# lint-yaml.yml fails the PR. Renovate itself cannot run the rebuild (the
# hosted app blocks postUpgradeTasks), so this workflow rebuilds the bundles
# on Renovate's pull requests and commits the result to the PR branch.

on:
  pull_request:
    paths:
      - "openchamber-modelselect/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: renovate-bundle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild the OpenChamber bundles
    # Only branches of this repository are touched: the workflow runs the
    # build from the PR branch and pushes to it. The dispatch trigger is a
    # manual verification run that checks the committed bundles.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'renovate/'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openchamber-modelselect
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.pull_request.head.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bundles
        run: bun run build

      - name: Commit the rebuilt bundles
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          set -euo pipefail
          bundles="openchamber-modelselect/panel/main.js openchamber-modelselect/service/main.js openchamber-modelselect/background/main.js"
          if git diff --quiet -- $bundles; then
            echo "The committed bundles are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $bundles
          git commit -m "build: rebuild the OpenChamber bundles"
          git push origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
          # A push made with GITHUB_TOKEN does not trigger workflows: GitHub
          # creates the runs for the new commit but holds them back until
          # they are approved. Approve them so the PR is checked by itself.
          # The records show up a few seconds after the push, one after the
          # other, so keep sweeping until four rounds in a row find
          # nothing new.
          sha="$(git rev-parse HEAD)"
          empty=0
          approved=0
          for attempt in $(seq 1 40); do
            ids="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&status=action_required" --jq '.workflow_runs[].id')"
            if [ -n "$ids" ]; then
              empty=0
              for id in $ids; do
                echo "Approving run $id"
                gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve"
                approved=$((approved + 1))
              done
            else
              empty=$((empty + 1))
              if [ "$empty" -ge 4 ]; then
                break
              fi
            fi
            sleep 5
          done
          echo "Approved $approved run(s) for $sha"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the committed bundles
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        run: |
          set -euo pipefail
          bundles="openchamber-modelselect/panel/main.js openchamber-modelselect/service/main.js openchamber-modelselect/background/main.js"
          if ! git diff --quiet -- $bundles; then
            echo "::error::The committed bundles do not match a fresh build."
            git --no-pager diff --stat -- $bundles
            exit 1
          fi
          echo "The committed bundles match a fresh build."
